name: CI

on:
  push:
    branches: [main, preprod, 'feat/**']
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8.1 : version de l'hébergement de recette. 8.4 : version cible du CDC.
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sodium
          coverage: none
      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Style (PSR-12)
        run: composer cs
      - name: Analyse statique (PHPStan)
        run: composer stan
      - name: Audit des dépendances
        run: composer audit
      - name: Tests
        run: composer test
