# Contrat OpenAPI 3.1 du parametrage de l'application Enseignement secondaire (spec 005, lot E1 : T815, T820 a T822, T838).
# Ouverture de l'application (copie du profil de type ajuste), changements de profil journalises (motif obligatoire, rien n'est
# supprime : module coupe en lecture seule, cycle portant des classes non retirable 409), niveaux (exemples a confirmer), series et
# specialites ouvertes (catalogue MINESEC), classes (RG-ORG-1 cycle du profil, RG-ORG-2 serie obligatoire au 2nd cycle ou en
# technique), matieres, coefficients et volumes PARAMETRES PAR L'ETABLISSEMENT (versions avec auteur, date, motif ; ligne verrouillee
# 422 coefficient-locked ; annee gelee 409 jamais recalculee ; copie vers une autre annee), salles, reglement interieur versionne.
# Routes /secondary/** : authentification, en-tete X-Establishment-Id ; GET -> 404 si l'application est fermee ; ecritures -> 423
# si l'abonnement est suspendu, 403 si l'application n'est pas ouverte (WriteGate). Listes paginees par curseur. Erreurs RFC 9457.
paths:
  /api/v1/secondary/setup/profile/open:
    post:
      summary: "Ouvrir l'application pour l'etablissement (T815) : ownership, cycles, teaching_kinds, sections, modules, head_title, official_code, reason ; propriete, cycles, enseignements et titre exiges quand le profil de type ne les fixe pas"
      parameters:
        - {name: X-Establishment-Id, in: header, required: true, schema: {type: string}}
      responses:
        '201': {description: "Succes {data}"}
        '400': {description: "Corps JSON illisible ou en-tete manquant"}
        '403': {description: "Permission absente, affectation hors etablissement entier ou application non ouverte"}
        '404': {description: "Application fermee ou ressource introuvable"}
        '409': {description: "Conflit : profil non ouvert ou deja ouvert, doublon, annee gelee, valeur portant des donnees"}
        '422': {description: "Validation (errors par champ)"}
        '423': {description: "Abonnement suspendu : ecriture refusee"}
  /api/v1/secondary/setup/profile/changes:
    get:
      summary: "Journal complet des changements de profil (opened, subtype, ownership, cycles, teaching_kinds, sections, head_title, modules, official_code), filtre filter[change_kind]"
      parameters:
        - {name: X-Establishment-Id, in: header, required: true, schema: {type: string}}
        - {name: per_page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
        - {name: sort, in: query, required: false, schema: {type: string}}
