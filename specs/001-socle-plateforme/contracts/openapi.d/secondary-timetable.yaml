# Contrat OpenAPI 3.1 de l'emploi du temps et du cahier de textes de l'application Enseignement secondaire (spec 005, lot E2-A :
# T860 a T863). Emploi du temps : affectations (classe ou demi-groupe, matiere a volume horaire parametre par l'etablissement,
# enseignant permanent ou vacataire, salle ; atelier seulement avec le module workshops : 409 module_not_enabled), plages
# horaires et disponibilites parametrees, generation assistee sans conflit (simulation puis application tout ou rien), pose
# manuelle (409 timetable-conflict : enseignant, salle ou atelier, classe), remplacements et permutations notifies (NOT-14),
# DOC-07 imprimable. Cahier de textes : API-06 seance signee hors ligne (client_uuid idempotent, rejeu 200), classe ou matiere
# non affectee 403 journalise, progressions, couverture (heures faites / heures prevues), visas, DOC-25, DOC-26, rappel NOT-12 ;
# inspecteur (R21) en lecture seule journalisee. Routes /secondary/** : authentification, en-tete X-Establishment-Id ; GET -> 404
# si l'application est fermee ; ecritures -> 423 si l'abonnement est suspendu, 403 si l'application n'est pas ouverte.
paths:
  /api/v1/secondary/timetable:
    get:
      summary: "Emploi du temps pose (filtres academic_year_id, class_id, teacher_person_id, room_id, on) ; l'enseignant voit le sien"
      parameters:
        - {name: X-Establishment-Id, in: header, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succes {data}"}
        '400': {description: "Corps JSON illisible ou en-tete manquant"}
        '403': {description: "Permission absente, classe hors perimetre (journalise), enseignant non affecte ou application non ouverte"}
        '404': {description: "Application fermee ou ressource introuvable"}
        '409': {description: "Conflit : profil non ouvert, conflit d'emploi du temps, module non active, doublon, lecons deja traitees"}
        '422': {description: "Validation (errors par champ)"}
        '423': {description: "Abonnement suspendu : ecriture refusee"}
  /api/v1/secondary/timetable/assignments:
    get:
      summary: "Affectations d'enseignement (filter[academic_year_id|class_id|teacher_person_id|status|group_code])"
