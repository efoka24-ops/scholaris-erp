# Contrat du questionnaire statistique des écoles publiques (contrat généré à partir des routes, réponses RFC 9457).
paths:
  /api/v1/public/census:
    get:
      summary: CensusController::index
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: per_page
          in: query
          required: false
          schema: { type: integer }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: structure_id
          in: query
          required: false
          schema: { type: string }
        - name: purpose
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: "Succès" }
        '201': { description: "Créé" }
        '400': { description: "Requête invalide" }
        '401': { description: "Authentification requise" }
        '403': { description: "Permission ou périmètre insuffisant" }
        '404': { description: "Introuvable dans le périmètre" }
        '409': { description: "Conflit : déjà publié, figé ou rejeu différent" }
        '422': { description: "Données invalides" }
        '423': { description: "Application en lecture seule" }
    post:
      summary: CensusController::open
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: "Succès" }
        '201': { description: "Créé" }
