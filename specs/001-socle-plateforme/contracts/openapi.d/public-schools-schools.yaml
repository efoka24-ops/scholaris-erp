# Contrat OpenAPI 3.1 du Primaire public (application public_primary, registre des écoles). Fusionné avec openapi.yaml par le test de contrat.
# Erreurs au format RFC 9457. Toutes les routes exigent l'authentification (401) et X-Establishment-Id.
paths:
  /api/v1/public/schools/current:
    get:
      summary: Fiche de l’école publique de l’établissement actif
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Fiche école
        '401':
          description: Authentification requise
        '404':
          description: Fiche ou permission indisponible dans cet établissement
    put:
      summary: "Créer ou mettre à jour la fiche de l’école"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200': { description: "Succès : enveloppe JSON {data}" }
        '201': { description: "Fiche créée" }
        '400': { description: "Requête invalide (JSON illisible)" }
        '401': { description: "Authentification requise" }
        '403': { description: "Permission insuffisante ou application non ouverte au rôle" }
        '404': { description: "Ressource inconnue, hors client, hors arrondissement ou hors classe (isolation)" }
        '409': { description: "Conflit d’état (version close, doublon, transition interdite)" }
        '422': { description: "Données invalides ou règle métier (RFC 9457, errors par champ)" }
        '423': { description: "Application en lecture seule (écriture fermée)" }
