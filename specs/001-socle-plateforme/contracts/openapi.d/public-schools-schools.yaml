# Contrat OpenAPI 3.1 du Primaire public (application public_primary, registre des écoles). Fusionné avec openapi.yaml par le test de contrat.
# Erreurs au format RFC 9457. Toutes les routes exigent l'authentification (401) et X-Establishment-Id.
paths:
  /api/v1/public/schools/current:
    get:
      summary: Fiche de l’école publique de l’établissement actif
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Fiche école
        '401':
          description: Authentification requise
        '404':
          description: Fiche ou permission indisponible dans cet établissement
  /api/v1/public-primary/registry/profile:
    get:
      summary: 'GET /public-primary/registry/profile'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
      responses:
        200:
          description: 'Succès : enveloppe JSON {data}'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        403:
          description: 'Accès refusé (permission, application suspendue ou fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
    put:
      summary: 'PUT /public-primary/registry/profile'
      security:
        -
          bearer: {  }
