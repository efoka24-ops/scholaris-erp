# Contrat de l'appel des classes et de la présence des enseignants des écoles publiques.
paths:
  /api/v1/public/classes/{id}/attendance/{date}:
    put:
      summary: Enregistrer ou corriger l'appel d'une classe par demi-journée
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day_part, client_uuid]
              properties: {}
      responses:
        '200': { description: Succès }
        '400': { description: Requête invalide }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '409': { description: Conflit }
        '422': { description: Données invalides }
        '423': { description: Application en lecture seule }
    get:
      summary: État de l'appel d'une classe un jour donné
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Succès }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '422': { description: Données invalides }
  /api/v1/public/classes/{id}/attendance-register:
    get:
      summary: Données du cahier d'appel mensuel (DOC-06)
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: month
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Succès }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '422': { description: Données invalides }
  /api/v1/public/staff/{id}/presence/{date}:
    put:
      summary: Déclarer la présence d'un enseignant
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presence]
              properties: {}
      responses:
        '200': { description: Succès }
        '400': { description: Requête invalide }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '409': { description: Conflit }
        '422': { description: Données invalides }
        '423': { description: Application en lecture seule }
  /api/v1/public/staff/{id}/presence/{date}/check:
    put:
      summary: Contrôle de l'inspection sur la présence d'un enseignant
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: date
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties: {}
      responses:
        '200': { description: Succès }
        '400': { description: Requête invalide }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '409': { description: Conflit }
        '422': { description: Données invalides }
        '423': { description: Application en lecture seule }
  /api/v1/public/teacher-presence:
