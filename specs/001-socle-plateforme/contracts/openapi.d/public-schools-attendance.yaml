      summary: Présences des enseignants d'un jour
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: date
          in: query
          required: false
          schema: { type: string }
        - name: purpose
          in: query
          required: false
          schema: { type: string }
        - name: per_page
          in: query
          required: false
