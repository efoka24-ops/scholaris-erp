        '404': { description: Introuvable dans le périmètre }
        '422': { description: Données invalides }
  /api/v1/public/uncovered-classes:
    get:
      summary: Classes sans enseignant d'un jour (RG-PRE-2)
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: date
          in: query
