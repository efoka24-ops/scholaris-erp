        '422': {description: "Validation (errors par champ), refus de la garde d'inscription, alerte d'age, exclu definitif"}
        '423': {description: "Abonnement suspendu : ecriture refusee"}
  /api/v1/secondary/enrolment/students/{id}:
    get:
      summary: "Dossier de l'eleve (identite courte, statut du matricule, redoublement, exclusion, inscriptions, transferts)"
      parameters:
