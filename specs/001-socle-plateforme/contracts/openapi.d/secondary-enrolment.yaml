# Contrat OpenAPI 3.1 des inscriptions de l'application Enseignement secondaire (spec 005, lot E1 : T823 a T827, API-01, API-02).
# Inscription (fiche et garants du socle, inscription du socle dans une classe parametree, garde organisation.enrolment.guards.secondary :
# classe parametree, cycle du profil RG-ORG-1, autorisation valide RG-ORG-3 si le module authorizations est actif, exclu definitif
# RG-INS-3), alerte d'age RG-INS-2 (422 admission-age-alert ; decision motivee du chef, secondary.enrol.validate), aucun controle de
# paiement (RG-INS-4). Matricule national : tenu par CarteScolaire (contrat NationalIds), jamais dans une adresse (l'adresse porte
# l'identifiant interne de la personne). Preinscriptions, fichier d'echange du primaire signe (HMAC-SHA256, idempotent), reinscription
# des eleves autorises par le conseil, transferts sortant et entrant, import des eleves (CSV ou XLSX, simulation puis application).
# Routes /secondary/** : authentification, en-tete X-Establishment-Id ; ecritures -> 423 si l'abonnement est suspendu, 403 si
# l'application n'est pas ouverte (WriteGate). Listes paginees par curseur. Erreurs RFC 9457.
paths:
  /api/v1/secondary/enrolments:
    post:
      summary: "API-01 : inscrire un eleve {person_id | identity, guardians?, class_id, entry_date, national_id?, repeater?, entry_kind?, age_decision_reason?, exclusion_decision_reason?, documents_checked?, confirm_different?, special_situation?}"
      parameters:
        - {name: X-Establishment-Id, in: header, required: true, schema: {type: string}}
      responses:
        '201': {description: "Succes {data}"}
        '400': {description: "Corps JSON illisible ou en-tete manquant"}
        '403': {description: "Permission absente, classe hors perimetre, decision reservee au chef ou application non ouverte"}
        '404': {description: "Application fermee ou ressource introuvable"}
        '409': {description: "Conflit : profil non ouvert, matricule deja attribue, inscription en cours ailleurs, etat incompatible"}
        '422': {description: "Validation (errors par champ), refus de la garde d'inscription, alerte d'age, exclu definitif"}
        '423': {description: "Abonnement suspendu : ecriture refusee"}
  /api/v1/secondary/enrolment/students:
    get:
      summary: "Eleves inscrits (annee, classe, statut du matricule ; pending=1 : liste a regulariser RG-INS-1), perimetre classe applique"
      parameters:
        - {name: X-Establishment-Id, in: header, required: true, schema: {type: string}}
        - {name: per_page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
        - {name: academic_year_id, in: query, required: false, schema: {type: string}}
        - {name: class_structure_id, in: query, required: false, schema: {type: string}}
        - {name: pending, in: query, required: false, schema: {type: string, enum: ['0', '1']}}
      responses:
        '200': {description: "Succes {data}"}
        '400': {description: "Corps JSON illisible ou en-tete manquant"}
        '403': {description: "Permission absente, classe hors perimetre, decision reservee au chef ou application non ouverte"}
        '404': {description: "Application fermee ou ressource introuvable"}
