# Contrat de la cantine et de la santé scolaire des écoles publiques (repas, stocks, campagnes de santé en effectifs) (contrat généré à partir des routes, réponses RFC 9457).
paths:
  /api/v1/public/canteen/meals:
    get:
      summary: CanteenController::meals
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: per_page
          in: query
          required: false
          schema: { type: integer }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string }
        - name: purpose
          in: query
          required: false
          schema: { type: string }
        - name: year_label
          in: query
          required: false
          schema: { type: string }
        - name: date
          in: query
          required: false
          schema: { type: string }
        - name: month
          in: query
          required: false
          schema: { type: string }
        - name: structure_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: "Succès" }
        '201': { description: "Créé" }
        '400': { description: "Requête invalide" }
        '401': { description: "Authentification requise" }
        '403': { description: "Permission ou périmètre insuffisant" }
        '404': { description: "Introuvable dans le périmètre" }
        '409': { description: "Conflit : état incompatible ou rejeu différent" }
        '422': { description: "Données invalides" }
        '423': { description: "Application en lecture seule" }
  /api/v1/public/canteen/meals/{date}:
    put:
      summary: CanteenController::saveMeals
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: date
          in: path
          required: true
          schema: { type: string }
      requestBody:
