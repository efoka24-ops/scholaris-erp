# Contrat OpenAPI 3.1 de la saisie des notes de l'application Supérieur (NOT, API-09 à API-12, API-16).
# Erreurs RFC 9457 ; WriteGate (423 suspendue) et périmètre école/département/affectation comme toutes les routes Higher.
paths:
  /api/v1/higher/grades/settings:
    get:
      summary: "Réglages de la saisie (cycle de vie, codes d'absence et effets RG-NOT-5, pondérations F1, délai de requête)"
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/grades/progress:
    get:
      summary: "Suivi de la saisie par évaluation (EX-NOT-08) : saisies, état, retard"
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/grades/sync:
    post:
      summary: "Rejouer un lot de saisies hors ligne avec contrôle de version ; conflits renvoyés, jamais résolus automatiquement"
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grades/elements/{elementId}/statistics:
    get:
      summary: "Statistiques d'un EC (note indicative F1, par groupe)"
      parameters:
        - {name: elementId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/grade-assessments:
    get:
      summary: "Évaluations du périmètre : filter[element_id|group_id|status|kind|exam_session|school_id] ; mine=1 pour l'enseignant"
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
    post:
      summary: "Créer une évaluation (EC, nature cc/tp/exam/retake, poids, barème, échéance de saisie)"
      responses:
        '201': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}:
    get:
      summary: "Évaluation"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
    patch:
      summary: "Modifier une évaluation en brouillon"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/marks:
    get:
      summary: "Grille de saisie (anonymisée si l'anonymat est actif)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
    put:
      summary: "Saisir les notes d'une évaluation (API-09, enseignant affecté, contrôle de version)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/marks/import:
    post:
      summary: "Importer les notes depuis le modèle CSV ou XLSX"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/marks/template:
    get:
      summary: "Modèle d'import des notes"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/grade-assessments/{id}/transition:
    post:
      summary: "Transition du cycle de vie (brouillon, soumise, validée, verrouillée, publiée)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/submit:
    post:
      summary: "Soumettre la saisie (API-10)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/send-back:
    post:
      summary: "Renvoyer la saisie à l'enseignant avec motif"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/validate:
    post:
      summary: "Valider la saisie (chef de département ; séparation des tâches)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/lock:
    post:
      summary: "Verrouiller (API-11, double authentification récente)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/publish:
    post:
      summary: "Publier les notes aux étudiants (NOT-12)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/anonymity/lift:
    post:
      summary: "Lever l'anonymat après verrouillage"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-assessments/{id}/statistics:
    get:
      summary: "Statistiques d'une évaluation (moyenne, extrêmes, réussite, absences)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/grade-marks/{id}/events:
    get:
      summary: "Historique d'une note (journal avant et après)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/grade-marks/{id}/changes:
    post:
      summary: "Demander la correction d'une note verrouillée (API-12, motif et pièce, RG-NOT-2)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '201': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-corrections:
    get:
      summary: "Demandes de correction : filter[status|assessment_id]"
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/grade-corrections/{id}:
    get:
      summary: "Demande de correction"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/grade-corrections/{id}/approve:
    post:
      summary: "Approuver une correction (chef de département puis directeur d'école ; jamais le demandeur)"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-corrections/{id}/reject:
    post:
      summary: "Refuser une correction avec motif"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/grade-queries:
    get:
      summary: "Requêtes d'étudiants sur les notes publiées (EX-NOT-07)"
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/grade-queries/{id}/respond:
    post:
      summary: "Répondre à une requête d'étudiant"
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
        '423': {description: "Application suspendue (écriture refusée)"}
  /api/v1/higher/students/me/results:
    get:
      summary: "Notes publiées et résultats de l'étudiant connecté (API-16)"
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
  /api/v1/higher/students/me/grade-queries:
    get:
      summary: "Requêtes de l'étudiant connecté"
      responses:
        '200': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '422': {description: "Filtre invalide"}
    post:
      summary: "Déposer une requête sur une note publiée, dans le délai"
      responses:
        '201': {description: "Succès"}
        '403': {description: "Permission absente ou hors périmètre (journalisé)"}
        '404': {description: "Introuvable ou hors périmètre"}
        '409': {description: "État incompatible (cycle de vie, version)"}
        '422': {description: "Données invalides"}
