# Contrat OpenAPI 3.1 de la Maternelle privée, sous-module Attendance (application nursery). Fusionné avec openapi.yaml par le test de contrat.
# Erreurs au format RFC 9457. Toutes les routes exigent l'authentification (401) et X-Establishment-Id ; application suspendue : 423 en écriture.
paths:
  '/api/v1/nursery/sections/{id}/roll':
    get:
      summary: 'GET /nursery/sections/{id}/roll'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
        -
          name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        200:
          description: 'Succès : enveloppe JSON {data}, avec meta {next_cursor, per_page} (pagination par curseur)'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        403:
          description: 'Accès refusé (permission, application fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
  '/api/v1/nursery/sections/{id}/call':
    post:
      summary: 'POST /nursery/sections/{id}/call'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        201:
          description: 'Succès : enveloppe JSON {data}'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        403:
          description: 'Accès refusé (permission, application fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        409:
          description: 'Conflit (doublon, version du serveur)'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
        423:
          description: 'Application suspendue : lecture et export seulement, écriture refusée'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                day_part:
                  type: string
                  enum:
                    - morning
                    - afternoon
                    - full_day
                client_uuid:
                  type: string
                  maxLength: 40
                date:
                  type: string
                  format: date
                validate:
                  type: boolean
                exceptions:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required:
                      - child_id
                      - status
                    properties:
                      child_id: { type: string }
                      status: { type: string, enum: [A, R] }
                      arrived_at: { type: string, maxLength: 32 }
                      note: { type: string, maxLength: 200 }
              required:
                - day_part
                - client_uuid
  '/api/v1/nursery/children/{id}/arrival':
    post:
      summary: 'POST /nursery/children/{id}/arrival'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        201:
          description: 'Succès : enveloppe JSON {data}'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        403:
          description: 'Accès refusé (permission, application fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        409:
          description: 'Conflit (doublon, version du serveur)'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
        423:
          description: 'Application suspendue : lecture et export seulement, écriture refusée'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                arrived_at:
                  type: string
                  maxLength: 32
                client_uuid:
                  type: string
                  maxLength: 40
