# Contrat OpenAPI 3.1 du service S01 Identité (fusionné avec openapi.yaml par le test de contrat).
paths:
  /api/v1/auth/login:
    post:
      summary: "Connexion par e-mail (ou téléphone) et mot de passe (option remember, client web = cookie HttpOnly). Réponse : token, new_device, two_factor_required, two_factor_setup_required, password_change_required"
      description: >-
        `password_change_required` vrai : le mot de passe est provisoire (émis par l'administrateur) et la session ne sert qu'à
        POST /auth/change-password, GET /me et la déconnexion. La double authentification n'est exigée que si le réglage
        d'exploitation l'impose ; l'administrateur de plateforme y est toujours soumis.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: {type: string}
                password: {type: string}
                remember: {type: boolean}
                device_id: {type: string}
                client: {type: string, enum: [web, mobile]}
      responses:
        '200':
          description: "Connecté (jeton opaque ; 2FA éventuellement à franchir)"
        '401':
          description: "Identifiants incorrects ; attempts_left donne les essais restants (réponse identique si l'identifiant est inconnu)"
        '422':
          description: "Champs manquants"
        '423':
          description: "Compte verrouillé 15 minutes (locked_until, Retry-After) ou bloqué par « Ce n'est pas moi »"
  /api/v1/auth/login-authenticator:
    post:
      summary: "Connexion de l'administrateur de la plateforme par application d'authentification : identifiant + code à 6 chiffres, sans mot de passe (comptes du client technique platform avec 2FA activée ; code à usage unique)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier: {type: string}
                code: {type: string, pattern: '^[0-9]{6}$'}
                remember: {type: boolean}
                device_id: {type: string}
                client: {type: string, enum: [web, mobile]}
      responses:
        '200':
          description: "Connecté, session déjà vérifiée (le code est le second facteur)"
        '401':
          description: "Identifiant ou code incorrect, compte non éligible ou code déjà utilisé (réponse identique) ; attempts_left donne les essais restants"
        '422':
          description: "Champs manquants ou code mal formé"
        '423':
          description: "Compte verrouillé 15 minutes (locked_until, Retry-After) ou bloqué par « Ce n'est pas moi »"
  /api/v1/auth/logout:
    post:
      summary: "Ferme la session courante"
      security:
        - bearer: []
      responses:
        '204':
          description: "Session fermée"
        '401':
          description: "Non authentifié"
  /api/v1/auth/activation/request:
    post:
      summary: "Envoie un code d'activation à 6 chiffres (5 min, 3 essais, renvoi après 60 s) par SMS ou e-mail"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: {type: string}
                channel: {type: string, enum: [sms, email]}
      responses:
        '200':
          description: "Réponse identique que le compte existe ou non : channel, masked_to, expires_in, resend_in"
        '422':
          description: "Identifiant invalide"
        '429':
          description: "Renvoi trop rapide (Retry-After)"
  /api/v1/auth/activation/verify:
    post:
      summary: "Vérifie le code reçu et renvoie le ticket qui autorise le choix du mot de passe"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier: {type: string}
                code: {type: string}
      responses:
        '200':
          description: "Code valide : ticket"
        '422':
          description: "Code incorrect, expiré ou épuisé (attempts_left)"
  /api/v1/auth/activation/password:
    post:
      summary: "Définit le mot de passe (10 caractères minimum, refus des mots de passe compromis) et active le compte"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, password]
              properties:
                ticket: {type: string}
                password: {type: string}
                password_confirmation: {type: string}
      responses:
        '200':
          description: "Compte actif"
        '422':
          description: "Ticket expiré ou mot de passe refusé"
  /api/v1/auth/password/forgot:
    post:
      summary: "Démarre la réinitialisation du mot de passe par code (même réponse que la demande d'activation)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: {type: string}
                channel: {type: string, enum: [sms, email]}
      responses:
        '200':
          description: "channel, masked_to, expires_in, resend_in"
        '422':
          description: "Identifiant invalide"
        '429':
          description: "Renvoi trop rapide (Retry-After)"
  /api/v1/auth/not-me:
    post:
      summary: "« Ce n'est pas moi » : verrouille le compte et révoque tous les appareils et jetons"
      security:
        - bearer: []
      responses:
        '200':
          description: "Compte bloqué"
        '401':
          description: "Non authentifié"
  /api/v1/auth/2fa/verify:
    post:
      summary: "Valide le code TOTP (ou SMS avec method=sms) ; trust_device fait confiance à l'appareil 30 jours"
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
                method: {type: string, enum: [totp, sms]}
                trust_device: {type: boolean}
      responses:
        '200':
          description: "Double authentification franchie"
        '401':
          description: "Trois échecs : session fermée"
        '422':
          description: "Code incorrect (attempts_left)"
  /api/v1/auth/2fa/sms:
    post:
      summary: "Envoie un code de double authentification par SMS"
      security:
        - bearer: []
      responses:
        '200':
          description: "channel, masked_to, expires_in, resend_in"
        '409':
          description: "Aucun numéro enregistré"
        '429':
          description: "Renvoi trop rapide"
  /api/v1/auth/2fa/recovery:
    post:
      summary: "Utilise un code de secours (8 caractères, usage unique)"
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
                trust_device: {type: boolean}
      responses:
        '200':
          description: "Double authentification franchie ; backup_codes_left"
        '401':
          description: "Trois échecs : session fermée"
        '422':
          description: "Code incorrect (attempts_left)"
  /api/v1/auth/2fa/setup:
    post:
      summary: "Génère la clé TOTP (secret, secret_grouped, otpauth_uri) et indique les rôles qui l'exigent"
      security:
        - bearer: []
      responses:
        '200':
          description: "Clé à scanner ou saisir"
        '409':
          description: "Déjà activée"
  /api/v1/auth/2fa/confirm:
    post:
      summary: "Confirme l'activation avec un premier code ; renvoie les 10 codes de secours (affichés une seule fois)"
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200':
          description: "Activée ; backup_codes"
        '401':
          description: "Trois échecs : session fermée"
        '409':
          description: "Pas de clé générée ou déjà activée"
        '422':
          description: "Code incorrect (attempts_left)"
  /api/v1/me:
    get:
      summary: "Profil de la personne connectée (prénom, état de la 2FA, contexte actif)"
      security:
        - bearer: []
      responses:
        '200':
          description: "Profil"
        '401':
          description: "Non authentifié"
  /api/v1/me/contexts:
    get:
      summary: "Tuiles « Mes établissements » : id, nom, type, accent, logo, rôles, période en cours (champ period : trimestre, semestre ou séquence couvrant la date du jour, omis si inconnue), deux indicateurs (champ indicators, omis si aucune source) ; tuile « Tout le groupe » pour la direction de groupe"
      security:
        - bearer: []
      responses:
        '200':
          description: "Contextes accessibles"
        '403':
          description: "Double authentification requise"
  /api/v1/me/context:
    post:
      summary: "Change d'établissement (ou « group ») et de rôle sans reconnexion"
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [establishment_id]
              properties:
                establishment_id: {type: string}
                role: {type: string}
      responses:
        '422':
          description: "Établissement ou rôle absent ou invalide"
        '200':
          description: "Contexte actif"
        '403':
          description: "Établissement ou rôle non autorisé"
  /api/v1/me/todo:
    get:
      summary: "Tâches à faire de la personne (approbations, signatures, saisies en attente)"
      security:
        - bearer: []
      responses:
        '200':
          description: "Liste (vide tant qu'aucun module n'en fournit)"
  /api/v1/me/devices:
    get:
      summary: "Appareils connectés (current marque l'appareil courant)"
      security:
        - bearer: []
      responses:
        '200':
          description: "Appareils"
  /api/v1/me/devices/{id}:
    delete:
      summary: "Révoque un appareil et ses jetons"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: "Appareil révoqué"
        '404':
          description: "Appareil introuvable"
  /api/v1/me/sessions:
    delete:
      summary: "Déconnecter partout : révoque tous les jetons"
      security:
        - bearer: []
      responses:
        '204':
          description: "Toutes les sessions sont fermées"
  /api/v1/role-assignments:
    get:
      summary: "Liste des affectations de rôle (filtres person_id, role, scope_type ; pagination par curseur)"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: "Page d'affectations"
        '403':
          description: "Accès refusé"
    post:
      summary: "Attribue un rôle à une personne dans un périmètre (tenant, establishment, org_unit, class, structure, territory), avec dates de validité. Un périmètre territory ne porte pas d'establishment_id (422) et exige un administrateur du client (403 sinon) ; scope_id doit désigner un territoire actif du client (422)."
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '201':
          description: "Affectation créée"
        '403':
          description: "Accès refusé"
        '422':
          description: "Données invalides"
  /api/v1/audit/named-access:
    get:
      summary: "PP3 (T607) : consultations nominatives de l'établissement actif (qui, quoi, finalité, date), des plus récentes aux plus anciennes ; permission identity.named_access.read (directeur) ; pagination par curseur"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: cursor
          in: query
          required: false
          schema: {type: string}
        - name: per_page
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: "Page {data: [{id, actor_id, record_type, record_id, purpose, accessed_at}], meta: {next_cursor}}"
        '400':
          description: "En-tête X-Establishment-Id manquant"
        '401':
          description: "Non authentifié"
        '403':
          description: "Accès refusé"
        '422':
          description: "Curseur ou per_page invalide"
  /api/v1/role-assignments/delegations:
    post:
      summary: "Délègue temporairement à une autre personne un rôle que l'on exerce (date de fin obligatoire, 90 jours au plus)"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '201':
          description: "Délégation créée"
        '403':
          description: "Rôle non détenu"
        '422':
          description: "Données invalides"
  /api/v1/role-assignments/{id}:
    delete:
      summary: "Retire une affectation ou une délégation"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: "Affectation retirée"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
  /api/v1/users:
    post:
      summary: "Inscrit une personne et crée son compte en attente d'activation (permission identity.manage)"
      description: >-
        Fiche unique par client (FR-006) : le compte est rattaché à la fiche `person_id` si elle est fournie (sans compte),
        sinon à l'unique fiche sans compte de même téléphone ou e-mail et de mêmes prénom et nom ; une nouvelle fiche
        n'est créée qu'à défaut. La réponse indique `person_linked`.

        Avec `provisional_password: true` (connexion simple), le compte est directement actif avec un mot de passe provisoire
        généré (12 caractères non ambigus, haché Argon2id) rendu UNE fois dans `provisional_password`
        (Cache-Control: no-store, jamais journalisé) ; la personne doit le remplacer à sa première connexion
        (`must_change_password`).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name: {type: string}
                last_name: {type: string}
                phone: {type: string}
                email: {type: string}
                locale: {type: string, enum: [fr, en]}
                person_id: {type: string}
                provisional_password: {type: boolean}
      responses:
        '201':
          description: "Compte créé (person_id, user_id, person_linked, status pending ; avec provisional_password : status active, login, must_change_password, provisional_password)"
        '403':
          description: "Accès refusé"
        '404':
          description: "Fiche person_id introuvable dans ce client"
        '409':
          description: "Téléphone ou e-mail déjà utilisé, ou la fiche désignée a déjà un compte"
        '422':
          description: "Données invalides"
  /api/v1/auth/change-password:
    post:
      summary: "Change le mot de passe de la personne connectée (obligatoire après un mot de passe provisoire)"
      description: >-
        Le mot de passe actuel (ou provisoire) est exigé. Tant que le mot de passe provisoire n'est pas remplacé, la session
        ne sert qu'à cette route, à GET /me et à la déconnexion (403 `password-change-required` ailleurs). Les autres sessions
        du compte sont fermées. Mêmes compteurs d'échecs et même verrouillage que la connexion.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string, description: "10 caractères au moins, ni courant ni contenant l'identifiant ou le nom"}
                new_password_confirmation: {type: string}
      responses:
        '200':
          description: "Mot de passe remplacé (changed, password_change_required false)"
        '422':
          description: "Mot de passe actuel incorrect (type invalid-password, attempts_left) ou nouveau mot de passe refusé (errors.new_password)"
        '423':
          description: "Verrouillé 15 minutes (locked_until, Retry-After)"
  /api/v1/auth/reconfirm:
    post:
      summary: "Confirmation récente par mot de passe (10 minutes) pour les actions sensibles d'une personne sans double authentification"
      description: >-
        Preuve enregistrée sur la session. Réservée aux comptes SANS double authentification : les autres confirment par leur
        code (`/auth/2fa/verify`), et l'administrateur de plateforme n'y a jamais droit (409 `second-factor-required`).
        Mêmes compteurs et verrouillage que la connexion.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
      responses:
        '200':
          description: "Confirmé (confirmed, confirmed_at, valid_for en secondes)"
        '409':
          description: "Le compte utilise la double authentification (type second-factor-required)"
        '422':
          description: "Mot de passe incorrect (type invalid-password, attempts_left)"
        '423':
          description: "Verrouillé 15 minutes (locked_until, Retry-After)"
  /api/v1/users/{id}/provisional-password:
    post:
      summary: "Ré-émet un mot de passe provisoire pour un compte de l'établissement (permission identity.manage)"
      description: >-
        Remplace « Réinitialiser l'accès » pour le personnel. Le mot de passe en clair (12 caractères) n'est rendu qu'ici, une
        seule fois (Cache-Control: no-store), jamais journalisé. L'ancien mot de passe, les sessions et les codes ouverts sont
        invalidés ; changement obligatoire à la prochaine connexion. `reset_two_factor` efface aussi l'authentificateur.
        Refus : son propre compte (409), compte bloqué (409), compte d'administration du client sans être super administrateur
        (403), personne sans rôle dans cet établissement (404). 5 ré-émissions par heure et par compte (429).
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          description: "Identifiant du compte, ou de la personne à laquelle il est rattaché"
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reset_two_factor: {type: boolean}
      responses:
        '200':
          description: "user_id, login, status, must_change_password, provisional_password"
        '403':
          description: "Accès refusé"
        '404':
          description: "Compte introuvable dans ce client ou hors de cet établissement"
        '409':
          description: "Son propre compte, ou compte bloqué"
        '429':
          description: "Trop de ré-émissions pour ce compte (Retry-After)"
