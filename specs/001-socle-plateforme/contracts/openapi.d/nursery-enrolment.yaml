# Contrat OpenAPI 3.1 de la Maternelle privée, sous-module Enrolment (application nursery). Fusionné avec openapi.yaml par le test de contrat.
# Erreurs au format RFC 9457. Toutes les routes exigent l'authentification (401) et X-Establishment-Id ; application suspendue : 423 en écriture.
paths:
  /api/v1/nursery/children:
    get:
      summary: 'GET /nursery/children'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
        -
          name: section_id
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Succès : enveloppe JSON {data}, avec meta {next_cursor, per_page} (pagination par curseur)'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        403:
          description: 'Accès refusé (permission, application fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
  '/api/v1/nursery/children/{id}':
    get:
      summary: 'GET /nursery/children/{id}'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Succès : enveloppe JSON {data}'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        403:
          description: 'Accès refusé (permission, application fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
  /api/v1/nursery/enrolments:
    post:
      summary: 'POST /nursery/enrolments'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
      responses:
        201:
          description: 'Succès : enveloppe JSON {data}'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        403:
          description: 'Accès refusé (permission, application fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        409:
          description: 'Conflit (doublon, version du serveur)'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
        423:
          description: 'Application suspendue : lecture et export seulement, écriture refusée'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                first_name:
                  type: string
                  maxLength: 120
                last_name:
                  type: string
                  maxLength: 120
                birth_date:
                  type: string
                  format: date
                gender:
                  type: string
                  enum:
                    - male
                    - female
                birth_place:
                  type: string
                  maxLength: 160
                nationality:
                  type: string
                  maxLength: 80
                section_id:
                  type: string
                allergies:
                  type: string
                  maxLength: 500
                photo_consent:
                  type: boolean
                consent_evidence:
                  type: string
                  maxLength: 120
                confirm_different:
                  type: boolean
                guardians:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    type: object
                    required:
                      - kind
                    properties:
                      kind: { type: string, enum: [financial_guarantor, guardian, parent, emergency] }
                      person_id: { type: string }
                      identity: { type: object }
              required:
                - first_name
                - last_name
                - birth_date
                - section_id
                - guardians
