  /api/v1/settings:
    get:
      summary: "Valeurs définies à un niveau (filter[scope] platform, tenant, establishment ou org_unit avec filter[org_unit_id] ; filter[key])"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: "Page de paramètres"
        '403':
