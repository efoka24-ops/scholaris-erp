# Contrat OpenAPI 3.1 du service S02 Organisation (fusionné avec openapi.yaml par le test de contrat).
paths:
  /api/v1/establishments:
    get:
      summary: "Liste des établissements du client (filtre type ; tris name, type, created_at)"
      security:
        - bearer: []
      responses:
        '200':
          description: "Page d'établissements"
        '403':
          description: "Accès refusé"
        '422':
          description: "Filtre ou tri hors liste blanche"
    post:
      summary: "Crée un établissement (type définitif)"
      security:
        - bearer: []
      responses:
        '201':
          description: "Établissement créé"
        '403':
          description: "Accès refusé"
        '409':
          description: "Nom déjà employé"
        '422':
          description: "Données invalides"
  /api/v1/establishments/{id}:
    get:
      summary: "Détail d'un établissement du client"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Établissement"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable ou autre client"
    patch:
      summary: "Renomme un établissement (le type ne peut pas changer)"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Établissement modifié"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
        '409':
          description: "Nom déjà employé"
        '422':
          description: "Tentative de changer le type"
  /api/v1/establishments/{id}/branding:
    get:
      summary: "Identité visuelle (accent, logo, en-têtes, signataires, numéros d'autorisation)"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Identité"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
    put:
      summary: "Modifie l'identité visuelle (accent #RRGGBB, contraste d'au moins 4,5:1 avec du texte noir)"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Identité enregistrée"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
        '422':
          description: "Couleur ou logo refusé"
  /api/v1/establishments/{id}/modules:
    get:
      summary: "Modules activés pour l'établissement"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Modules activés et disponibles"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
    put:
      summary: "Remplace la liste des modules activés"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Modules enregistrés"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
        '422':
          description: "Module inconnu"
  /api/v1/territories:
    get:
      summary: "Territoires du client valides à la date `at` (ISO 8601, maintenant par défaut) ; arbre région > département > arrondissement versionné ; pagination par curseur (meta.next_cursor)"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: at
          in: query
          required: false
          schema: {type: string}
        - name: cursor
          in: query
          required: false
          schema: {type: string}
        - name: per_page
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: "Page de territoires valides à la date demandée : {data, meta: {next_cursor, at}}"
        '400':
          description: "Paramètre at invalide"
        '403':
          description: "Accès refusé"
        '422':
          description: "Curseur ou per_page invalide"
    post:
      summary: "Crée un territoire (version 1) : type, code, libellés FR/EN, parent facultatif, date de début"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '201':
          description: "Territoire créé"
        '400':
          description: "Corps illisible"
        '403':
          description: "Accès refusé"
        '422':
          description: "Données invalides ou parent introuvable"
  /api/v1/territories/{id}:
    get:
      summary: "Version du territoire valide à la date `at`"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: at
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: "Territoire"
        '400':
          description: "Paramètre at invalide"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable ou autre client"
  /api/v1/territories/{id}/versions:
    post:
      summary: "Ajoute une version du territoire à partir d'une date ; l'ancienne version est close, jamais réécrite"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: "Version créée"
        '400':
          description: "Corps illisible"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable ou autre client"
        '409':
          description: "Chevauchement d'une période close"
        '422':
          description: "Données invalides, cycle ou date antérieure à la version courante"
  /api/v1/territories/{id}/lineage:
    get:
      summary: "Lignée du territoire (lui-même puis ses parents jusqu'à la racine) à la date `at`"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: at
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: "Lignée"
        '400':
          description: "Paramètre at invalide"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable ou autre client"
  /api/v1/territories/{id}/descendants:
    get:
      summary: "Territoire et descendants à la date `at`"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: at
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: "Territoire et descendants"
        '400':
          description: "Paramètre at invalide"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable ou autre client"
  /api/v1/territories/{id}/establishments:
    put:
      summary: "Rattache des établissements au territoire à une date d'effet (RG-TER-4) : l'ancien lien est clos à cette date, jamais réécrit ; répéter un rattachement ouvert ne change rien. Permission organisation.territories.manage de niveau client ; aucun établissement actif requis"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifiant ULID du territoire du client"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [establishment_ids, valid_from]
              properties:
                establishment_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: {type: string, maxLength: 40}
                valid_from:
                  type: string
                  description: "Date d'effet ISO 8601 avec fuseau, normalisée en UTC"
      responses:
        '200':
          description: "Rattachement enregistré : territory_id, valid_from (UTC) et establishment_ids"
        '403':
          description: "Permission de niveau client manquante"
        '404':
          description: "Territoire ou établissement introuvable dans ce client"
        '409':
          description: "La date d'effet réécrirait le passé ou chevaucherait une période close"
        '422':
          description: "Liste d'établissements ou date invalide"
  /api/v1/vocabulary:
    get:
      summary: "Vocabulaire de l'interface par type d'établissement (paramètre type)"
      security:
        - bearer: []
      responses:
        '200':
          description: "Termes"
        '401':
          description: "Non authentifié"
        '422':
          description: "Type inconnu"
  /api/v1/org-units:
    get:
      summary: "Liste des unités internes de l'établissement actif (curseur, filtres et tris en liste blanche)"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: "Page de résultats"
        '403':
          description: "Accès refusé"
        '422':
          description: "Filtre ou tri hors liste blanche"
    post:
      summary: "Crée une unité interne"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '201':
          description: "Créé"
        '403':
          description: "Accès refusé"
        '409':
          description: "Doublon"
        '422':
          description: "Données invalides"
  /api/v1/org-units/{id}:
    get:
      summary: "Détail de une unité interne"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Ressource"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
    patch:
      summary: "Modifie une unité interne"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Modifié"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
        '409':
          description: "Conflit"
        '422':
          description: "Données invalides"
  /api/v1/academic-years:
    get:
      summary: "Liste des années scolaires de l'établissement actif (curseur, filtres et tris en liste blanche)"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: "Page de résultats"
        '403':
          description: "Accès refusé"
        '422':
          description: "Filtre ou tri hors liste blanche"
    post:
      summary: "Crée une année scolaire"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '201':
          description: "Créé"
        '403':
          description: "Accès refusé"
        '409':
          description: "Doublon"
        '422':
          description: "Données invalides"
  /api/v1/academic-years/{id}:
    get:
      summary: "Détail de une année scolaire"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Ressource"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
    patch:
      summary: "Modifie une année scolaire"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Modifié"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
        '409':
          description: "Conflit"
        '422':
          description: "Données invalides"
  /api/v1/academic-years/{id}/close:
    post:
      summary: "Demande la clôture de l'année scolaire de cet établissement (organisation.manage ; corps facultatif next_academic_year_id). Les contrôles préalables bloquants refusent la demande (409) ; sinon une demande d'approbation est créée (202, ou 200 si une demande est déjà en cours). L'année n'est close qu'à l'approbation par une autre personne"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Demande déjà en cours"
        '202':
          description: "Demande de clôture déposée, en attente d'approbation"
        '403':
          description: "Accès refusé"
        '404':
          description: "Introuvable"
        '409':
          description: "Déjà clôturée ou contrôle bloquant (impayés, notes non verrouillées, délibérations ouvertes)"
        '422':
          description: "Année suivante invalide"
  /api/v1/periods:
    get:
      summary: "Liste des périodes de l'établissement actif (curseur, filtres et tris en liste blanche)"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: "Page de résultats"
        '403':
          description: "Accès refusé"
        '422':
          description: "Filtre ou tri hors liste blanche"
    post:
      summary: "Crée une période ; une séquence peut déclarer parent_id vers un trimestre de la même année"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '201':
          description: "Créé"
        '403':
