    put:
      summary: "Définit un paramètre à un niveau {scope, key, value, org_unit_id si scope=org_unit} (tracé dans le journal d'audit)"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: "Valeur enregistrée et valeur effective"
        '403':
          description: "Accès refusé"
        '422':
          description: "Données invalides"
  /api/v1/settings/effective:
    get:
      summary: "Valeur effective avec son origine et les niveaux masqués (filter[key], filter[org_unit_id] : héritage plateforme > client > établissement > unités parentes > unité)"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: "Valeurs effectives"
        '403':
          description: "Accès refusé"
        '404':
