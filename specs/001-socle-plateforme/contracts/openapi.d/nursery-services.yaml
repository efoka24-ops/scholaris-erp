# Contrat OpenAPI 3.1 de la Maternelle privée, sous-module Services (garderie, cantine, transport) : offres, abonnements, facturation par cycle, présence.
# Erreurs au format RFC 9457. Toutes les routes exigent l'authentification (401) et X-Establishment-Id ; application suspendue : 423 en écriture.
paths:
  /api/v1/nursery/services/plans:
    get:
      summary: 'GET /nursery/services/plans'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
        -
          name: kind
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Succès : enveloppe JSON {data}, avec meta {next_cursor, per_page} (pagination par curseur)'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        401:
          description: 'Authentification requise'
        403:
          description: 'Accès refusé (permission, application fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
    post:
      summary: 'POST /nursery/services/plans'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum:
                    - daycare
                    - canteen
                    - transport
                label:
                  type: string
                  maxLength: 160
                fee_item_id:
                  type: string
                  maxLength: 40
                billing_cycle:
                  type: string
                  enum:
                    - month
                    - term
                    - year
              required:
                - kind
                - label
                - fee_item_id
                - billing_cycle
      responses:
        201:
          description: 'Succès : enveloppe JSON {data}'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        401:
          description: 'Authentification requise'
        403:
          description: 'Accès refusé (permission, application fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        409:
          description: 'Conflit (état incompatible, doublon)'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
        423:
          description: 'Application suspendue : lecture et export seulement, écriture refusée'
  '/api/v1/nursery/services/plans/{id}':
    patch:
      summary: 'PATCH /nursery/services/plans/{id}'
      security:
        -
          bearer: {  }
      parameters:
        -
          $ref: '#/components/parameters/EstablishmentId'
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label:
                  type: string
                  maxLength: 160
                fee_item_id:
                  type: string
                  maxLength: 40
                active:
                  type: boolean
      responses:
        200:
          description: 'Succès : enveloppe JSON {data}'
        400:
          description: 'Requête invalide (en-tête X-Establishment-Id manquant, JSON illisible)'
        401:
          description: 'Authentification requise'
        403:
          description: 'Accès refusé (permission, application fermée)'
        404:
          description: 'Ressource introuvable ou hors périmètre'
        409:
          description: 'Conflit (état incompatible, doublon)'
        422:
          description: 'Données invalides ou refus métier (RFC 9457)'
        423:
          description: 'Application suspendue : lecture et export seulement, écriture refusée'
  /api/v1/nursery/services/subscriptions:
    get:
      summary: 'GET /nursery/services/subscriptions'
