# Contrat OpenAPI 3.1 des documents du secondaire : DOC-01 a DOC-06, DOC-27 a DOC-29 (E1) et DOC-21 a DOC-24 (E3) du CDC, emis par
# le socle Documents (numero unique par etablissement, type et annee ; QR de verification publique sans note ni matricule ; contenu fige ;
# FR/EN). DOC-01 (preinscription) et l'exeat apres transfert sont aussi emis par le contrat interne SecondaryDocuments ; DOC-27 (recu)
# est produit par le socle Billing. Aucun document scolaire ne porte de montant (RG-DOC-4). Routes /secondary/** : authentification,
# en-tete X-Establishment-Id, GET -> 404 si l'application est fermee, ecritures -> 423 abonnement suspendu, 403 application non ouverte.
paths:
  /api/v1/secondary/documents/kinds:
    get:
      summary: "Catalogue des documents du secondaire : numero DOC-nn, nature, QR, module et capacite requise, disponibilite selon le profil, droit d'emission"
      description: "Permission secondary.documents.issue, secondary.enrol.manage, secondary.enrol.read, secondary.billing.manage ou secondary.settings.manage. Le catalogue liste aussi les documents des autres sous-modules (DOC-19, 20, 31 examens ; DOC-30 paie, module payroll_simple). DOC-21/22 demandent internships et l'enseignement technical du profil ; DOC-23/24 demandent workshops et ce meme enseignement (409 profile_capability_not_offered sinon). Les sous-modules proprietaires emettent ces documents par le contrat SecondaryDocuments (direct=false). Modeles FR/EN neutres amorces au socle, editables par l'etablissement (aucune clause juridique inventee)."
      parameters:
        - {name: X-Establishment-Id, in: header, required: true, schema: {type: string}}
      responses:
        '200': {description: "{data: {items: [{doc, kind, type, label_fr, label_en, qr, source, module, required_teaching_kind, available, direct, can_issue}]}}"}
        '403': {description: "Permission absente"}
        '404': {description: "Application fermee"}
        '422': {description: "Type d'etablissement invalide"}
  /api/v1/secondary/documents/issued:
    get:
      summary: "Documents du secondaire valides d'un eleve (numero, nature, jeton de verification), sans contenu"
      parameters:
        - {name: X-Establishment-Id, in: header, required: true, schema: {type: string}}
        - {name: person_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: "{data: {items: [{id, number, kind, doc, type, status, qr, verification_token, subject_person_id}]}}"}
        '403': {description: "Permission absente"}
        '404': {description: "Eleve sans inscription dans l'etablissement ou hors perimetre"}
        '422': {description: "person_id manquant"}
  /api/v1/secondary/documents/candidates:
    get:
      summary: "Inscriptions d'une classe du perimetre (en cours, ou closes par transfert pour l'exeat), pour choisir l'eleve d'un document"
      parameters:
        - {name: X-Establishment-Id, in: header, required: true, schema: {type: string}}
        - {name: class_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: "{data: {items: [{enrollment_id, person_id, name, status, internal_number}]}}"}
        '403': {description: "Permission absente"}
        '404': {description: "Classe hors perimetre"}
        '422': {description: "class_id manquant"}
  /api/v1/secondary/documents:
    post:
      summary: "Emettre un document du secondaire (variables tirees de l'inscription, de la classe ou de la facture du socle)"
      description: "Inscription (enrolment_form, school_certificate, school_card ; exeat seulement pour une inscription close par le transfert, avec destination, motif et date) : secondary.documents.issue ou secondary.enrol.manage, perimetre de classe. Classe (class_list, enregistree au nom de l'agent) : memes droits. Facture (account_statement DOC-28, payment_attestation DOC-29 sans reste du) : secondary.billing.manage. Les types caller-issued DOC-21 a DOC-24 sont reserves aux modules internships/workshops, et le profil doit declarer la capacite technical ; ces types ne sont pas emis sur cette route. Langue : demandee, sinon section de l'etablissement (RG-DOC-5). Les gardes de remise du socle (blocage pour impaye du prive) s'appliquent."
      parameters:
        - {name: X-Establishment-Id, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: {type: string, enum: [enrolment_form, school_certificate, school_card, exeat, class_list, account_statement, payment_attestation]}
                enrollment_id: {type: string}
                class_id: {type: string}
                invoice_id: {type: string}
                destination: {type: string, maxLength: 160}
                reason: {type: string, maxLength: 255}
                effective_on: {type: string, format: date}
                locale: {type: string, enum: [fr, en]}
      responses:
        '201': {description: "{data: {id, number, kind, doc, type, status, qr, verification_token, locale, subject_person_id, enrollment_id|class_id|invoice_id}}"}
        '403': {description: "Permission absente ou classe hors perimetre (journalise)"}
        '404': {description: "Inscription, classe ou facture introuvable dans l'etablissement"}
        '409': {description: "Module non actif (module_not_enabled) ou profil sans capacite technique requise (profile_capability_not_offered)"}
        '422': {description: "Nature inconnue ou non emise par cette route, champ obligatoire manquant, inscription non en cours (ou non close pour l'exeat), aucun paiement constate pour l'attestation, modele absent"}
