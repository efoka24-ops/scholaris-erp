# Contrat OpenAPI 3.1 du module Platform : catalogue d'applications, droits d'usage par client, demandes d'accès publiques,
# administrateur de plateforme et abonnements (fusionné avec openapi.yaml par le test de contrat).
# Erreurs au format RFC 9457 (components/schemas/Problem). Montants entiers en XAF, dates AAAA-MM-JJ ou ISO 8601.
# Routes /platform/** : compte du client technique `platform` avec le rôle platform_admin ; les actions marquées
# « 2FA récente » exigent une double authentification validée depuis moins de 15 minutes (403 two-factor-recent-required).
# Blocage central d'un client en régularisation de paiement (middleware du noyau, avant tout contrôleur), pour TOUTES les routes
# authentifiées du socle et des applications, quel que soit le client HTTP :
#  - niveau `locked` : tout est refusé, 423 de type https://api.scholaris.cm/errors/regularisation-required, sauf la liste blanche ;
#  - niveau `read_only` : les requêtes qui modifient (hors GET, HEAD, OPTIONS) sont refusées, 423 de type
#    https://api.scholaris.cm/errors/subscription-suspended ; lecture et exports restent permis.
# Liste blanche (chemins sous /api/v1) : /auth/**, /me, /me/context, /me/contexts, /me/regularisation/**,
# /applications/{key}/payments, /application-payments/{id}/receipt, /public/**, /health, /platform/** (compte de plateforme, jamais
# restreint) et les webhooks de paiement. Le niveau du client est celui de TOUTES ses applications non fermées bloquées pour impayé
# (une application à jour suffit à ne rien restreindre au niveau du socle). Le déblocage est immédiat (paiement vérifié).
# La réponse 423 est commune (components/responses/RegularisationBlocked) : titre et détail en français ou en anglais
# (Accept-Language), membres `level` et `regularisation_url` (écran de régularisation), jamais de donnée du client. Elle n'est pas
# répétée sur chaque opération.
components:
  responses:
    RegularisationBlocked:
      description: "Client en régularisation de paiement : locked (type regularisation-required, toute route hors liste blanche) ou read_only (type subscription-suspended, écritures seulement)"
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  level: {type: string, enum: [read_only, locked]}
                  regularisation_url: {type: string, example: "/regularisation"}
paths:
  /api/v1/public/applications:
    get:
      summary: "Catalogue public : une application par niveau (family : higher, nursery, primary, secondary) et par régime (sector : private, public). Champs : clé, libellé, cible (= family), régime, statut, tarif mensuel XAF, jours d'essai"
      security: []
      responses:
        '200':
          description: "Liste des applications, par niveau (higher, nursery, primary, secondary) puis privé avant public ; les applications retirées et non listées (module commun public_schools) sont exclues"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [key, label, target, family, sector, status, version, monthly_price_xaf, trial_days]
                      properties:
                        key: {type: string, description: "Clé technique de l'application à ouvrir pour ce régime"}
                        label: {type: string, description: "Libellé du niveau, sans le régime (ex. École primaire)"}
                        target: {type: string, enum: [higher, secondary, primary, nursery]}
                        family: {type: string, enum: [higher, secondary, primary, nursery], description: "Niveau (identique à target)"}
                        sector: {type: string, enum: [private, public]}
                        status: {type: string, enum: [available, coming_soon]}
                        version: {type: string}
                        monthly_price_xaf: {type: integer}
                        trial_days: {type: integer}
  /api/v1/public/access-requests:
    post:
      summary: "Demande d'accès sans compte. Limitation : 5 par heure et par IP, 3 par jour et par e-mail ; champ piège `website` ; champs inconnus refusés"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [institution_name, target_type, city, region, contact_first_name, contact_last_name, contact_email, app_key]
              properties:
                institution_name: {type: string, minLength: 3, maxLength: 160}
                target_type: {type: string, enum: [higher, secondary, primary, nursery]}
                city: {type: string, minLength: 2, maxLength: 80}
                region: {type: string, minLength: 2, maxLength: 80}
                country: {type: string, pattern: '^[A-Z]{2}$', default: CM}
                contact_first_name: {type: string, maxLength: 80}
                contact_last_name: {type: string, maxLength: 80}
                contact_email: {type: string, format: email, maxLength: 190}
                contact_phone: {type: string, description: "Format international, 8 à 15 chiffres"}
                contact_position: {type: string, maxLength: 80}
                ministerial_authorization: {type: string, maxLength: 120, description: "Référence de l'autorisation ministérielle, facultative"}
                app_key: {type: string, description: "Application du régime choisi (privé ou public) ; sa cible doit être target_type ; refusée (422) si retirée ou non listée (public_schools)."}
                establishment_subtype: {type: string, enum: [leg, lycee_technique, ces, cetic, college_prive, lycee_prive, autre], description: "Type d'établissement : OBLIGATOIRE pour le secondaire (liste fermée, 422 sinon), refusé pour les autres niveaux. Repris sur l'établissement créé à l'acceptation"}
                message: {type: string, maxLength: 2000}
                locale: {type: string, enum: [fr, en]}
                website: {type: string, description: "Champ piège : doit rester vide (réponse leurre sinon)"}
      responses:
        '202':
          description: "Demande enregistrée : jeton de suivi (affiché une seule fois). Réponse identique que l'e-mail soit connu ou non"
        '400':
          description: "Corps JSON invalide"
        '422':
          description: "Données invalides"
        '429':
          description: "Limite de débit atteinte (Retry-After)"
  /api/v1/public/access-requests/{token}:
    get:
      summary: "Suivi d'une demande par son jeton (statut, complément demandé, motif de refus ; aucune donnée de contact)"
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{48}$'}
      responses:
        '200':
          description: "État de la demande"
        '404':
          description: "Jeton inconnu"
        '429':
          description: "Limite de débit atteinte"
  /api/v1/public/access-requests/{token}/complement:
    post:
      summary: "Réponse du demandeur à une demande de complément ({ message }) ; la demande repasse en attente"
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Demande mise à jour"
        '404':
          description: "Jeton inconnu"
        '409':
          description: "Aucun complément attendu"
        '422':
          description: "Données invalides"
  /api/v1/platform/settings:
    get:
      summary: "Réglages de la plateforme : valeur, défaut, bornes (access_code_ttl_minutes : validité des codes d'accès créés depuis le back-office)"
      responses:
        '200': {description: "Réglages"}
        '403': {description: "Réservé à l'administrateur de plateforme"}
    patch:
      summary: "Modifier un réglage (2FA récente, journalisé)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_code_ttl_minutes: {type: integer, minimum: 5, maximum: 10080}
                regularisation_default_level: {type: integer, minimum: 0, maximum: 1, description: "Niveau de blocage par défaut d un impayé : 0 lecture et export seulement, 1 tout bloqué sauf la régularisation"}
                regularisation_request_expiry_days: {type: integer, minimum: 1, maximum: 60, description: "Jours avant qu une déclaration de paiement non confirmée expire (défaut 7)"}
                regularisation_amount_tolerance_xaf: {type: integer, minimum: 0, maximum: 10000, description: "Écart toléré entre montant déclaré et reçu (défaut 100)"}
                regularisation_partial_min_xaf: {type: integer, minimum: 100, maximum: 1000000, description: "Montant minimum d un paiement partiel déclaré (défaut 1000)"}
                regularisation_partial_mode: {type: integer, minimum: 0, maximum: 1, description: "Paiement partiel confirmé : 0 période prolongée proportionnellement (défaut), 1 crédit du solde seulement ; dans les deux cas le niveau ne change qu à la couverture du solde"}
      responses:
        '200': {description: "Réglages mis à jour"}
        '403': {description: "Réservé à l'administrateur de plateforme ; 2FA récente exigée"}
        '422': {description: "Valeur hors bornes"}
  /api/v1/platform/settings/contact:
    get:
      summary: "Contact et numéros de paiement mobile money de la plateforme : valeurs saisies (stored) et valeurs effectives (effective) avec repli sur les variables d environnement PLATFORM_CONTACT_* et PLATFORM_PAY_*"
      security:
        - bearer: []
      responses:
        '200': {description: "stored {name, email, phone, payments[]}, effective, updated_at"}
        '403': {description: "Réservé à l'administrateur de plateforme"}
    patch:
      summary: "Remplace le contact saisi : nom, e-mail valide, téléphone camerounais normalisé +237, et 0 à 2 numéros de paiement (Orange Money, MTN MoMo, un par moyen) avec le nom du bénéficiaire ; un champ vide se replie sur l environnement (2FA récente, permission platform.settings.manage, journalisé sans numéro en clair)"
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: [string, "null"], maxLength: 120}
                email: {type: [string, "null"], format: email}
                phone: {type: [string, "null"], example: "+237 6 99 00 00 01"}
                payments:
                  type: array
                  maxItems: 2
                  items:
                    type: object
                    required: [channel, phone, holder]
                    properties:
                      channel: {type: string, enum: [orange_money, mtn_momo]}
                      phone: {type: string}
                      holder: {type: string, maxLength: 120}
      responses:
        '200': {description: "Contact enregistré"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '422': {description: "E-mail, téléphone, moyen ou bénéficiaire invalide"}
  /api/v1/platform/dashboard:
    get:
      summary: "Tableau de bord de la plateforme : clients, demandes en attente, applications ouvertes, essais qui se terminent (14 j), impayés, MRR ; indicateur sans source = available:false"
      security:
        - bearer: []
      responses:
        '200':
          description: "Indicateurs"
        '403':
          description: "Réservé à l'administrateur de plateforme"
  /api/v1/platform/applications:
    get:
      summary: "Catalogue complet (y compris retirées et non listées), modules du socle requis, tarif, essai, délai de grâce, régime (sector), famille (family) et listed (false : application technique absente des catalogues)"
      security:
        - bearer: []
      responses:
        '200':
          description: "Applications"
        '403':
          description: "Réservé à l'administrateur de plateforme"
  /api/v1/platform/applications/{key}:
    patch:
      summary: "Modifie libellé, statut (available, coming_soon, retired), version, tarif mensuel XAF, jours d'essai, délai de grâce (2FA récente)"
      security:
        - bearer: []
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Application mise à jour"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Application inconnue"
        '422':
          description: "Données invalides"
  /api/v1/platform/clients:
    get:
      summary: "Clients de la plateforme : fiche (état active|suspended|archived, contact, ville, région) et droits d'usage (aucune donnée métier). filter[state] : par défaut tous sauf les archivés"
      security:
        - bearer: []
      responses:
        '200':
          description: "Clients"
        '403':
          description: "Réservé à l'administrateur de plateforme"
        '422':
          description: "Filtre invalide"
    post:
      summary: "Crée un client directement, sans demande d'accès, avec son premier établissement si establishment_type est donné (2FA récente ; platform.clients.manage)"
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, contact_name]
              properties:
                name: {type: string, minLength: 3, maxLength: 160}
                contact_name: {type: string, minLength: 2, maxLength: 160}
                contact_email: {type: string, format: email, description: "E-mail ou téléphone obligatoire"}
                contact_phone: {type: string}
                city: {type: string, maxLength: 80}
                region: {type: string, maxLength: 80}
                locale: {type: string, enum: [fr, en]}
                establishment_type: {type: string, enum: [higher, secondary, primary, nursery]}
      responses:
        '201':
          description: "Client créé"
        '403':
          description: "Refusé ou 2FA récente requise"
        '422':
          description: "Données invalides"
  /api/v1/platform/clients/{tenant}:
    get:
      summary: "Détail d'un client : fiche, établissements (nom, type, fermeture) et droits d'usage"
      security:
        - bearer: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Client"
        '403':
          description: "Réservé à l'administrateur de plateforme"
        '404':
          description: "Client introuvable"
    patch:
      summary: "Modifie la fiche ({ name?, contact_name?, contact_email?, contact_phone?, city?, region?, locale? }) (2FA récente)"
      security:
        - bearer: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Client modifié"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Client introuvable"
        '409':
          description: "Client archivé"
        '422':
          description: "Données invalides ou aucune modification"
  /api/v1/platform/clients/{tenant}/applications:
    post:
      summary: "Ouvre une application à un client ({ app_key }), en essai gratuit ; active les modules requis (2FA récente)"
      security:
        - bearer: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: {type: string}
      responses:
        '201':
          description: "Droit d'usage ouvert"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Client ou application introuvable"
        '409':
          description: "Déjà ouverte ou application retirée"
  /api/v1/platform/clients/{tenant}/applications/{key}:
    patch:
      summary: "Tarif mensuel propre au client ({ monthly_price_xaf: entier | null }) (2FA récente)"
      security:
        - bearer: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: {type: string}
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Droit d'usage mis à jour"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Introuvable"
        '422':
          description: "Données invalides"
  /api/v1/platform/clients/{tenant}/applications/{key}/suspend:
    post:
      summary: "Suspend l'application ({ reason } obligatoire) : écritures refusées, lecture et export conservés (2FA récente)"
      security:
        - bearer: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: {type: string}
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Suspendue"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Introuvable"
        '409':
          description: "État incompatible"
  /api/v1/platform/clients/{tenant}/applications/{key}/close:
    post:
      summary: "Ferme l'application ({ reason } obligatoire) (2FA récente)"
      security:
        - bearer: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: {type: string}
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Fermée"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Introuvable"
        '409':
          description: "Déjà fermée"
  /api/v1/platform/clients/{tenant}/applications/{key}/reactivate:
    post:
      summary: "Réactive une application suspendue ({ reason?, until?: AAAA-MM-JJ pour couvrir jusqu'à cette date }) (2FA récente)"
      security:
        - bearer: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema: {type: string}
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Réactivée"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Introuvable"
        '409':
          description: "Non suspendue"
  /api/v1/platform/access-requests:
    get:
      summary: "Demandes d'accès, la plus récente d'abord (filter[status]=pending|info_requested|accepted|rejected, filter[archived]=0|1 (0 par défaut), pagination par curseur)"
      security:
        - bearer: []
      responses:
        '200':
          description: "Page de demandes"
        '403':
          description: "Réservé à l'administrateur de plateforme"
        '422':
          description: "Filtre invalide"
  /api/v1/platform/access-requests/{id}:
    get:
      summary: "Détail d'une demande d'accès"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Demande"
        '403':
          description: "Réservé à l'administrateur de plateforme"
        '404':
          description: "Introuvable"
    delete:
      summary: "Supprime définitivement une demande ARCHIVÉE qui n'a créé aucun client (journalisé) (2FA récente)"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Demande supprimée"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Introuvable"
        '409':
          description: "Demande non archivée ou ayant créé un client"
  /api/v1/platform/access-requests/{id}/accept:
    post:
      summary: "Accepte ({ tenant_id?, force_reason?, share_send?: none|email|sms } ; tenant_id pour rattacher à un client existant) : crée client et établissement, ouvre l'application en essai de 90 jours, invite le premier administrateur (activation par code) (2FA récente)"
      description: "Une application à venir (coming_soon) ou retirée n'est pas ouverte en essai : refus 422 sur app_key, sauf si l'administrateur force explicitement avec un motif force_reason (tracé dans l'audit). Pour un nouveau client, la réponse porte data.access : code d'activation de l'administrateur invité (rendu une seule fois, Cache-Control no-store) et récapitulatif à partager (même forme que POST /platform/clients/{tenant}/users/{user}/access-code) ; share_send l'envoie aussitôt (canal indisponible signalé delivery.status = unavailable, échec = failed, sans annuler l'acceptation)."
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Demande acceptée, droit d'usage, administrateur invité et data.access (ou null si rattachement à un client existant)"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Introuvable"
        '409':
          description: "Déjà traitée"
        '422':
          description: "Client de rattachement introuvable, ou application à venir (coming_soon) ou retirée sans force_reason (F2)"
  /api/v1/platform/access-requests/{id}/reject:
    post:
      summary: "Refuse ({ reason } obligatoire, transmis au demandeur) (2FA récente)"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Demande refusée"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Introuvable"
        '409':
          description: "Déjà traitée"
        '422':
          description: "Motif manquant"
  /api/v1/platform/access-requests/{id}/request-info:
    post:
      summary: "Demande un complément au demandeur ({ message })"
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: "Complément demandé"
        '403':
          description: "Réservé à l'administrateur de plateforme"
        '404':
          description: "Introuvable"
        '409':
          description: "Déjà traitée"
  /api/v1/platform/payments:
    get:
      summary: "Paiements d'abonnement de tous les clients, le plus récent d'abord (filter[status]=pending|succeeded|failed|cancelled, filter[tenant_id], curseur)"
      security:
        - bearer: []
      responses:
        '200':
          description: "Page de paiements"
        '403':
          description: "Réservé à l'administrateur de plateforme"
    post:
      summary: "Enregistre un paiement manuel confirmé (espèces ou virement) avec reçu ; prolonge la période couverte (2FA récente ; platform.payments.manage)"
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_id, app_key, months, channel]
              properties:
                tenant_id: {type: string}
                app_key: {type: string}
                months: {type: integer, minimum: 1, maximum: 12}
                channel: {type: string, enum: [cash, bank_transfer]}
                amount_xaf: {type: integer, minimum: 1, description: "Par défaut : tarif effectif × mois"}
                note: {type: string, maxLength: 500}
      responses:
        '201':
          description: "Paiement enregistré"
        '403':
          description: "Refusé ou 2FA récente requise"
        '404':
          description: "Client ou application introuvable"
        '409':
          description: "Application fermée ou client archivé"
        '422':
          description: "Données invalides"
  /api/v1/platform/payments/webhook:
    post:
      summary: "Webhook de l'agrégateur de paiement (signature vérifiée par la passerelle ; idempotent par event_id)"
      security: []
      responses:
        '200':
          description: "Événement traité (outcome : succeeded, failed, duplicate, unknown_reference, amount_mismatch, already_*)"
        '401':
          description: "Signature absente ou invalide"
        '422':
          description: "Corps invalide"
  /api/v1/me/applications:
    get:
      summary: "Lanceur : applications ouvertes aux établissements de l'utilisateur (état, jours d'essai restants, échéance) ; meta.catalog : applications listées non ouvertes, avec family et sector, par niveau puis régime"
      security:
        - bearer: []
      responses:
        '200':
          description: "Applications de l'utilisateur"
        '403':
          description: "Compte de la plateforme"
  /api/v1/applications/{key}/open:
    post:
      summary: "Libre-service : ouvre l'application pour le client (essai gratuit de 90 jours) ; permission applications.manage"
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        '201':
