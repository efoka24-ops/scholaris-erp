      description: "Réponse { data: { code, purpose: activation|reset, expires_at, expires_in, login, delivery: { channel: none|email|sms, status: not_sent|sent|failed, masked_to }, share: { establishment_name, login, login_url, activation_url, locale, channels, message: { subject, text, sms } } } }. Le message (FR/EN selon la langue du compte) est prêt à copier ; le SMS (≤ 480 caractères) n'est proposé que pour un mobile camerounais (+237 6…). Un envoi en échec n'annule pas le code."
