  /api/v1/platform/clients/{tenant}/applications/{key}/options/{option}/remove:
    post:
      summary: "Résilie une option de service du client ({ reason } obligatoire) (2FA récente)"
      security:
        - bearer: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: option, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        '200': {description: "Droit d'usage mis à jour"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '404': {description: "Option non souscrite"}
        '422': {description: "Motif manquant"}
  /api/v1/platform/service-options:
    get:
      summary: "Options de service (clé, libellés fr/en, prix mensuel XAF, applications concernées, actif, nombre de souscripteurs)"
      security:
        - bearer: []
      responses:
        '200': {description: "Liste des options"}
        '403': {description: "Réservé à l'administrateur de plateforme"}
    post:
      summary: "Crée une option de service (2FA récente)"
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option_key, label_fr, label_en, monthly_price_xaf]
              properties:
                option_key: {type: string, pattern: "^[a-z][a-z0-9_]+$", maxLength: 30}
                label_fr: {type: string, maxLength: 120}
                label_en: {type: string, maxLength: 120}
                monthly_price_xaf: {type: integer, minimum: 0}
                app_keys: {type: array, items: {type: string}, description: "Applications concernées ([] : toutes)"}
      responses:
        '201': {description: "Option créée"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '409': {description: "Clé déjà utilisée"}
        '422': {description: "Données invalides"}
  /api/v1/platform/service-options/{key}:
    patch:
      summary: "Modifie une option (libellés, prix, applications, active) (2FA récente)"
      security:
        - bearer: []
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label_fr: {type: string, maxLength: 120}
                label_en: {type: string, maxLength: 120}
                monthly_price_xaf: {type: integer, minimum: 0}
                app_keys: {type: array, items: {type: string}}
                active: {type: boolean}
      responses:
        '200': {description: "Option mise à jour"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '404': {description: "Introuvable"}
        '422': {description: "Données invalides"}
    delete:
      summary: "Supprime une option que personne n'a souscrite (2FA récente)"
      security:
        - bearer: []
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: "Supprimée"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '404': {description: "Introuvable"}
        '409': {description: "Option souscrite par des clients : la désactiver"}
  /api/v1/platform/regularisation:
    get:
      summary: "Liste « À régulariser » : impayés, applications en régularisation, promesses de paiement en cours (montant dû, jours de retard, niveau) ; filtre filter[bucket] = past_due, regularisation ou promise"
      security:
        - bearer: []
      responses:
        '200': {description: "Liste, avec meta.total, meta.amount_due_xaf et meta.counts"}
        '403': {description: "Réservé à l'administrateur de plateforme"}
        '422': {description: "Filtre invalide"}
  /api/v1/platform/regularisation/export:
    get:
      summary: "Export CSV (ou xlsx avec ?format=xlsx) de la liste « À régulariser »"
      security:
        - bearer: []
      responses:
        '200': {description: "Fichier CSV"}
        '403': {description: "Réservé à l'administrateur de plateforme"}
        '422': {description: "Filtre ou format invalide"}
  /api/v1/platform/clients/{tenant}/regularisation/lock:
    post:
      summary: "Bloque à la main le client (toutes ses applications ouvertes, ou app_key) en mode régularisation de paiement, au niveau demandé (read_only : lecture et export ; locked : tout bloqué sauf la régularisation) ; reason obligatoire ; aucune donnée supprimée (2FA récente)"
      security:
        - bearer: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500}
                level: {type: string, enum: [read_only, locked]}
                app_key: {type: string}
      responses:
        '200': {description: "Droits d'usage bloqués"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '404': {description: "Client ou application introuvable"}
        '409': {description: "Déjà bloqué à ce niveau ou aucune application ouverte"}
        '422': {description: "Données invalides"}
  /api/v1/platform/clients/{tenant}/regularisation/unlock:
    post:
      summary: "Débloque le client ou l'application (reason obligatoire) ; si l'impayé le re-bloquerait, une promesse de paiement est posée jusqu'à `until` (7 jours par défaut) (2FA récente)"
      security:
        - bearer: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500}
                until: {type: string, format: date}
                app_key: {type: string}
      responses:
        '200': {description: "Droits d'usage débloqués"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '404': {description: "Client ou application introuvable"}
        '409': {description: "Aucune application bloquée pour impayé"}
        '422': {description: "Données invalides"}
  /api/v1/platform/clients/{tenant}/regularisation/delay:
    post:
      summary: "Promesse de paiement : reporte le blocage jusqu'à `until` (au plus 90 jours) ; une application déjà bloquée est débloquée jusqu'à cette date ; reason obligatoire (2FA récente)"
      security:
        - bearer: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until, reason]
              properties:
                until: {type: string, format: date}
                reason: {type: string, maxLength: 500}
                app_key: {type: string}
      responses:
        '200': {description: "Délai accordé"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '404': {description: "Client ou application introuvable"}
        '409': {description: "Aucune application impayée ou bloquée"}
        '422': {description: "Date ou motif invalide"}
  /api/v1/platform/clients/{tenant}/regularisation/level:
    post:
      summary: "Niveau de blocage choisi pour tout le client ({ level: read_only | locked | null, reason }) ; null revient au réglage de la plateforme ; appliqué aussitôt aux applications déjà en régularisation (2FA récente)"
      security:
        - bearer: []
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, reason]
              properties:
                level: {type: [string, "null"], enum: [read_only, locked, null]}
                reason: {type: string, maxLength: 500}
      responses:
        '200': {description: "Droits d'usage mis à jour"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '404': {description: "Client introuvable"}
        '409': {description: "Aucune application ouverte"}
        '422': {description: "Données invalides"}
  /api/v1/me/regularisation:
    get:
      summary: "Écran de régularisation du client de l'utilisateur : mode (ok, past_due, read_only, locked), par application montant dû, détail (tarif de base, options), période, jours de retard, promesse, reçus ; can_pay (droit applications.manage) ; contact de la plateforme"
      security:
        - bearer: []
      responses:
        '200': {description: "Situation de paiement du client (jamais celle d'un autre client) ; contact et payment_numbers (numéros de paiement mobile money de la plateforme) viennent des réglages du back-office, avec repli sur l'environnement ; par application balance_xaf (solde) et credit_xaf ; partial_min_xaf ; requests : suivi des déclarations (declared = en vérification, verified, rejected, expired ; numéro payeur masqué)"}
        '403': {description: "Compte de la plateforme"}
  /api/v1/me/regularisation/declarations:
    post:
      summary: "Le responsable de l'établissement (applications.manage) déclare un paiement mobile money fait à la plateforme : application, type total (solde dû) ou partial (amount_xaf entre le minimum et le solde moins 1), moyen (orange_money, mtn_momo), numéro payeur (mobile camerounais, normalisé +237, jamais renvoyé en clair), référence de la transaction ; crée une demande à l'état declared (en vérification). Idempotente : même idempotency_key = même demande ; une seule demande ouverte à la fois par application. NE DÉBLOQUE JAMAIS : seul un paiement vérifié (webhook ou confirmation du super admin) débloque. Prévient le super admin."
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_key, kind, channel, payer_phone, reference]
              properties:
                app_key: {type: string}
                kind: {type: string, enum: [total, partial]}
                amount_xaf: {type: integer, description: "Obligatoire pour partial, interdit pour total"}
                channel: {type: string, enum: [orange_money, mtn_momo]}
                payer_phone: {type: string}
                reference: {type: string, minLength: 3, maxLength: 120}
                idempotency_key: {type: string, minLength: 8, maxLength: 80}
      responses:
        '200': {description: "Même clé d'idempotence : demande déjà créée"}
        '201': {description: "Demande créée (declared)"}
        '403': {description: "Réservé au responsable (applications.manage) d'un client"}
        '409': {description: "Demande déjà ouverte, aucun solde à régulariser, application fermée ou référence déjà utilisée"}
        '422': {description: "Montant, numéro, type ou référence invalide"}
  /api/v1/platform/regularisation/declarations:
    get:
      summary: "Paiements déclarés à vérifier (numéro payeur masqué) ; filtres filter[state] = declared, verified, rejected, expired, filter[channel], filter[tenant_id] ; meta.counts par état"
      security:
        - bearer: []
      responses:
        '200': {description: "Liste, avec meta.total et meta.counts"}
        '403': {description: "Réservé à l'administrateur de plateforme"}
        '422': {description: "Filtre invalide"}
  /api/v1/platform/regularisation/declarations/export:
    get:
      summary: "Export CSV (ou xlsx avec ?format=xlsx) des paiements déclarés (mêmes filtres)"
      security:
        - bearer: []
      responses:
        '200': {description: "Fichier CSV"}
        '403': {description: "Réservé à l'administrateur de plateforme"}
        '422': {description: "Filtre ou format invalide"}
  /api/v1/platform/regularisation/declarations/{id}/confirm:
    post:
      summary: "Confirme le paiement constaté sur le relevé : montant réellement reçu, référence constatée facultative, note, promise_until facultatif (promesse de paiement accordée avec un paiement partiel). Un paiement qui couvre le solde (tolérance comprise) débloque aussitôt par le chemin des paiements manuels (état actif, période prolongée, reçu, blocage levé) et prévient le client ; sinon le montant est porté au crédit du solde et le niveau est conservé. Une même référence ne valide qu'une demande (2FA récente)"
      security:
        - bearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [received_amount_xaf]
              properties:
                received_amount_xaf: {type: integer, minimum: 1}
                reference: {type: string}
                note: {type: string, maxLength: 500}
                promise_until: {type: string, format: date}
      responses:
        '200': {description: "Demande vérifiée ; unlocked indique si le solde est couvert"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '404': {description: "Demande introuvable"}
        '409': {description: "Demande déjà traitée, référence déjà utilisée ou application fermée"}
        '422': {description: "Montant, référence ou date invalide"}
  /api/v1/platform/regularisation/declarations/{id}/reject:
    post:
      summary: "Rejette la demande (reason obligatoire) et prévient le client avec le motif (2FA récente)"
      security:
        - bearer: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        '200': {description: "Demande rejetée"}
        '403': {description: "Refusé ou 2FA récente requise"}
        '404': {description: "Demande introuvable"}
        '409': {description: "Demande déjà traitée"}
        '422': {description: "Motif obligatoire"}
