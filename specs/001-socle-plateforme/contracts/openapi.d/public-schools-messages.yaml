# Contrat de la communication des écoles publiques.
paths:
  /api/v1/public/messages:
    post:
      summary: Envoyer un SMS à une classe, un niveau ou l'école
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience, template_key]
              properties: {}
      responses:
        '200': { description: Succès }
        '201': { description: Créé }
        '400': { description: Requête invalide }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '409': { description: Conflit }
        '422': { description: Données invalides }
        '423': { description: Application en lecture seule }
    get:
      summary: Journal des envois de l'école
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: per_page
          in: query
          required: false
          schema: { type: integer }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Succès }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '422': { description: Données invalides }
  /api/v1/public/announcements:
    post:
      summary: Annoncer à toutes les écoles d'un territoire
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [territory_id]
              properties: {}
      responses:
        '200': { description: Succès }
        '201': { description: Créé }
        '400': { description: Requête invalide }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '409': { description: Conflit }
        '422': { description: Données invalides }
        '423': { description: Application en lecture seule }
