# Contrat du personnel des écoles publiques.
paths:
  /api/v1/public/staff:
    get:
      summary: Personnel enseignant de l'école
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: purpose
          in: query
          required: false
          schema: { type: string }
        - name: per_page
          in: query
          required: false
          schema: { type: integer }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Succès }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '422': { description: Données invalides }
  /api/v1/public/staff/needs:
    get:
      summary: Besoins en enseignants de l'école
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200': { description: Succès }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '422': { description: Données invalides }
  /api/v1/public/staff/{id}/profile:
    get:
      summary: Fiche de carrière
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: purpose
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Succès }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '422': { description: Données invalides }
    put:
      summary: Enregistrer la fiche de carrière
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_status]
              properties: {}
      responses:
        '200': { description: Succès }
        '400': { description: Requête invalide }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '409': { description: Conflit }
        '422': { description: Données invalides }
        '423': { description: Application en lecture seule }
  /api/v1/public/staff/{id}/trainings:
    get:
      summary: Formations suivies
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: per_page
          in: query
          required: false
          schema: { type: integer }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Succès }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '422': { description: Données invalides }
    post:
      summary: Enregistrer une formation
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_on]
              properties: {}
      responses:
        '200': { description: Succès }
        '201': { description: Créé }
        '400': { description: Requête invalide }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '409': { description: Conflit }
        '422': { description: Données invalides }
        '423': { description: Application en lecture seule }
  /api/v1/public/staff/{id}/moves:
    get:
      summary: Historique des mutations
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: purpose
          in: query
          required: false
          schema: { type: string }
      responses:
        '200': { description: Succès }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '422': { description: Données invalides }
    post:
      summary: Muter un membre du personnel dans le territoire
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/EstablishmentId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_establishment_id, effective_on]
              properties: {}
      responses:
        '200': { description: Succès }
        '201': { description: Créé }
        '400': { description: Requête invalide }
        '401': { description: Authentification requise }
        '403': { description: Permission ou périmètre insuffisant }
        '404': { description: Introuvable dans le périmètre }
        '409': { description: Conflit }
        '422': { description: Données invalides }
        '423': { description: Application en lecture seule }
